<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netiva — Excellence In Action</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Reset & base */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-mono: 'SF Mono', 'Fira Code', monospace;
      --color-text-primary: #0f0f0e;
      --color-text-secondary: #5c5b55;
      --color-text-tertiary: #9e9c96;
      --color-background-primary: #fafaf8;
      --color-background-secondary: #f0efe9;
      --color-border-primary: #b8b6ac;
      --color-border-secondary: #d4d2ca;
      --color-border-tertiary: #e5e4de;
      --color-accent: #314021;
      --color-accent-light: #e2edd8;
      --border-radius-md: 10px;
      --border-radius-lg: 16px;
    }
    body { font-family: var(--font-sans); color: var(--color-text-primary); font-size: 14px; background: #f2f2f2; margin: 0; padding: 0; }
    input, select, textarea, button { font-family: var(--font-sans); font-size: 13px; outline: none; }
    input, select, textarea { border: 1px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 8px 12px; background: var(--color-background-primary); color: var(--color-text-primary); transition: border-color .15s; }
    input:focus, select:focus, textarea:focus { border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(49,64,33,.08); }

    /* ── Top bar: sticky, sits right of sidebar, no search ── */
    .nav {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 24px;
      background: #f2f2f2;
      border-bottom: 1px solid #e0e0e0;
      position: sticky; top: 0; left: 240px; right: 0; z-index: 50;
      box-shadow: none;
      margin-left: 240px;
      min-height: 52px;
    }
    @media (max-width: 600px) { .nav { left: 0; margin-left: 0; } }
    /* Search form inside nav */
    .nav-search-wrap {
      flex: 1; display: flex; align-items: center; max-width: 640px;
      position: relative;
    }
    .nav-search-input {
      flex: 1; padding: 9px 40px 9px 16px;
      border: 1.5px solid #e0e0e0; border-right: none;
      border-radius: 999px 0 0 999px;
      font-size: 14px; background: #f7f7f7;
      transition: border-color .15s, background .15s; outline: none;
      color: var(--color-text-primary);
    }
    .nav-search-input:focus { border-color: #4a7c2f; background: #fff; }
    .nav-search-btn {
      padding: 9px 20px; background: #4a7c2f; border: none;
      border-radius: 0 999px 999px 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background .15s;
    }
    .nav-search-btn:hover { background: #3a6324; }
    .logo { font-family: var(--font-display); font-size: 22px; font-weight: 500; cursor: pointer; letter-spacing: -.3px; flex-shrink: 0; color: #fff; display: block; line-height: 1; }
    .logo-sub { display: block; font-size: 9px; font-weight: 400; color: rgba(255,255,255,.6); letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
    .logo-wrap { display: none; flex-direction: column; align-items: flex-start; cursor: pointer; flex-shrink: 0; }
    .logo-mob { font-family: var(--font-display); font-size: 20px; font-weight: 500; color: #314021; letter-spacing: -.3px; line-height: 1; }
    .logo-mob-sub { font-size: 8px; font-weight: 400; color: #9e9c96; letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }
    @media (max-width: 600px) {
      .logo-sub { display: none; }
      .logo-wrap { display: flex !important; }
    }
    .nav-c { display: flex; gap: 1.5rem; }
    .nav-c a { font-size: 13px; color: rgba(255,255,255,.75); cursor: pointer; text-decoration: none; letter-spacing: .01em; }
    .nav-c a:hover { color: #fff; }
    .nav-r { display: flex; align-items: center; gap: 8px; }
    .rate-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 3px 10px; color: rgba(255,255,255,.9); font-weight: 500; }
    .rate-dot { width: 6px; height: 6px; border-radius: 50%; background: #FAC775; flex-shrink: 0; }
    .rate-dot.live { background: #a8d878; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .rate-dot.loading { animation: pulse 1s infinite; }

    /* Hero section wraps nav + hero image so nav floats over it */
    .hero-section { position: relative; }
    .hero-section .nav { position: absolute; top: 0; left: 0; right: 0; z-index: 50; background: transparent; }
    /* After hero, a sentinel makes nav sticky */
    .nav-sticky-sentinel { position: sticky; top: 0; z-index: 49; height: 0; }
    .nav-clone { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 2rem; background: #314021; gap: 8px; position: sticky; top: 0; z-index: 49; box-shadow: 0 2px 16px rgba(0,0,0,.15); transform: translateY(-100%); transition: transform .25s ease; }
    .nav-clone.visible { transform: translateY(0); }
    /* Language dropdown */
    .lang-dd { position: relative; }
    .lang-dd-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; background: transparent; border: none; color: rgba(255,255,255,.8); padding: 4px 2px; }
    .lang-dd-btn:hover { color: #fff; }
    .lang-dd-btn svg { opacity: .5; }
    .lang-dd-menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--color-background-primary); border: .5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); box-shadow: 0 4px 16px rgba(0,0,0,.08); min-width: 110px; overflow: hidden; display: none; z-index: 200; }
    .lang-dd-menu.open { display: block; }
    .lang-dd-item { display: block; width: 100%; text-align: left; padding: 8px 14px; font-size: 13px; cursor: pointer; background: transparent; border: none; color: var(--color-text-secondary); }
    .lang-dd-item:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
    .lang-dd-item.on { color: var(--color-text-primary); font-weight: 500; }
    /* Nav link-style buttons (no border) */
    .nav-link-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; background: transparent; border: none; color: rgba(255,255,255,.8); padding: 4px 2px; }
    .nav-link-btn:hover { color: #fff; }
    /* Legacy lang-toggle hidden */
    .lang-toggle { display: none; }

    .btn { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 7px 16px; background: var(--color-background-primary); color: var(--color-text-primary); transition: all .15s; letter-spacing: .01em; }
    .btn:hover { background: var(--color-background-secondary); border-color: var(--color-border-primary); }
    .btn:active { transform: scale(.98); }
    .btn.p { background: var(--color-accent); color: #fff; border-color: transparent; box-shadow: 0 1px 3px rgba(49,64,33,.25); }
    .btn.p:hover { background: #243318; box-shadow: 0 2px 8px rgba(49,64,33,.3); }
    .btn.sm { font-size: 12px; padding: 4px 12px; }
    .btn.d { border-color: #F09595; color: #A32D2D; }
    .btn.d:hover { background: #FCEBEB; }
    .ava { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.2); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,.35); }
    .bdg { border-radius: 999px; font-size: 11px; font-weight: 500; padding: 2px 9px; display: inline-block; }
    .bdg.g { background: #e2edd8; color: #314021; }
    .bdg.b { background: #E6F1FB; color: #185FA5; }
    .bdg.a { background: #FEF3E2; color: #92540c; }

    .hero { position: relative; min-height: 220px; display: flex; align-items: center; justify-content: flex-start; text-align: left; background: linear-gradient(135deg, #1e2a14 0%, #314021 60%, #3d5028 100%); overflow: hidden; border-radius: 10px; }
    @media (max-width: 600px) { .hero { min-height: 200px; border-radius: 0; } }
    .hero-bg { position: absolute; inset: 0; object-fit: cover; width: 100%; height: 100%; }
    .hero-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
    .hero-content { position: relative; z-index: 2; padding: 2rem 2.5rem; max-width: 560px; margin: 0; }
    .hero.no-img .hero-overlay { background: rgba(0,0,0,.15); display: block; }
    .hero.no-img .hero-content h1 { color: #fff; }
    .hero.no-img .hero-content p { color: rgba(255,255,255,.8); }
    .hero h1 { font-family: var(--font-display); font-size: 32px; font-weight: 400; margin-bottom: 8px; letter-spacing: -.3px; color: #fff; line-height: 1.2; }
    .hero p { font-size: 14px; color: rgba(255,255,255,.8); margin-bottom: 1.25rem; line-height: 1.6; font-weight: 300; }
    .hero.no-img h1 { color: #fff; }
    .hero.no-img p { color: rgba(255,255,255,.75); }
    .filters { display: flex; gap: 8px; padding: 1rem 12px; flex-wrap: wrap; border-bottom: none; background: transparent; }
    .fpill { padding: 6px 16px; border-radius: 999px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--color-border-secondary); background: #fff; color: var(--color-text-secondary); transition: all .15s; letter-spacing: .02em; }
    .fpill:hover { border-color: var(--color-accent); color: var(--color-accent); background: var(--color-accent-light); }
    .fpill.on { background: var(--color-accent); color: #fff; border-color: transparent; box-shadow: 0 1px 4px rgba(49,64,33,.2); }
    /* Category bar */
    .cat-bar { display: flex; gap: 6px; padding: 10px 12px; background: transparent; border-bottom: none; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; white-space: nowrap; }
    .cat-bar::-webkit-scrollbar { display: none; }
    .cat-pill { flex-shrink: 0; display: inline-flex; align-items: center; padding: 6px 16px; border-radius: 999px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid #ddd; background: #fff; color: var(--color-text-secondary); transition: all .15s; letter-spacing: .01em; white-space: nowrap; }
    .cat-pill:hover { border-color: var(--color-accent); color: var(--color-accent); background: var(--color-accent-light); }
    .cat-pill.on { background: var(--color-accent); color: #fff; border-color: transparent; box-shadow: 0 1px 4px rgba(49,64,33,.2); }

    .prods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; padding: 8px; background: transparent; }
    @media (min-width: 601px) {
      .prods { padding: 0 20px 24px; gap: 20px; }
      .filters { padding-left: 20px; }
      .cat-bar { padding-left: 20px; }
    }
    @media (max-width: 1200px) { .prods { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 900px) { .prods { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 700px) { .prods { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 8px; } }
    .pc { background: #f2f2f2; border: none; border-radius: 8px; overflow: hidden; transition: box-shadow .2s; }
    .pc:hover { border-color: transparent; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    .pi { height: 200px; display: flex; align-items: center; justify-content: center; font-size: 80px; background: #f8f8f8; overflow: hidden; position: relative; }
    @media (max-width: 700px) { .pi { height: 180px; font-size: 48px; } .pb { padding: 7px 8px 10px; background: #f2f2f2; } .pn { font-size: 12px; } .price-cny { font-size: 15px; } .ab { font-size: 11px; padding: 5px 10px; } }
    .pi img { width: 100%; height: 100%; object-fit: cover; }
    .pi-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
    .pi-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.5); cursor: pointer; border: none; padding: 0; transition: background .15s; }
    .pi-dot.on { background: #fff; }
    .pi-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.35); border: none; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; opacity: 0; transition: opacity .15s; }
    .pc:hover .pi-nav { opacity: 1; }
    .pi-nav.left { left: 10px; }
    .pi-nav.right { right: 10px; }
    .pi-expand { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,.35); border: none; border-radius: var(--border-radius-md); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; opacity: 0; transition: opacity .15s; }
    .pc:hover .pi-expand { opacity: 1; }
    .pb { padding: 8px 10px 12px; background: #f2f2f2; }
    .pn { font-size: 16px; font-weight: 400; margin-bottom: 4px; letter-spacing: 0; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #333; }
    .pd { display: none; }
    .pf { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 4px; }
    .price-cny { font-size: 17px; font-weight: 700; color: #87B82A; }
    .price-usd { font-size: 11px; color: var(--color-text-tertiary); margin-top: 2px; }
    .ab { font-size: 11px; font-weight: 500; padding: 5px 12px; border-radius: 999px; border: 1px solid #87B82A; background: transparent; color: #87B82A; cursor: pointer; white-space: nowrap; transition: all .15s; }
    .ab:hover { background: #87B82A; color: #fff; }
    /* Product tag badge */
    .tag { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--color-accent-light); color: var(--color-accent); margin-bottom: 6px; border: 1px solid #b8d4a8; }

    /* ── Full-page product detail view ── */
    .pdp { display: none; margin-left: 220px; }
    .pdp.active { display: block; }
    @media (max-width: 600px) { .pdp { margin-left: 0; } }
    .pdp-top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 2rem; border-bottom: 1px solid var(--color-border-tertiary); background: rgba(250,250,248,.95); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 40; }
    .pdp-back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--color-text-secondary); cursor: pointer; background: none; border: none; padding: 0; font-weight: 500; }
    .pdp-back:hover { color: var(--color-accent); }
    .pdp-breadcrumb { font-size: 13px; color: var(--color-text-secondary); }
    .pdp-layout { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 120px); }
    .pdp-gallery-col { position: sticky; top: 53px; height: calc(100vh - 53px); background: var(--color-background-secondary); display: flex; flex-direction: column; overflow: hidden; }
    .pdp-main-img-wrap { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--color-background-secondary); }
    .pdp-main-img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 2rem; }
    .pdp-main-emoji { font-size: 120px; }
    .pdp-thumbs { display: flex; gap: 8px; padding: 12px 16px; background: var(--color-background-primary); border-top: 1px solid var(--color-border-tertiary); overflow-x: auto; flex-shrink: 0; }
    .pdp-thumb { width: 72px; height: 72px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; transition: border-color .15s; background: var(--color-background-secondary); }
    .pdp-thumb.on { border-color: var(--color-accent); }
    .pdp-gallery-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.35); border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; z-index: 2; transition: background .15s; }
    .pdp-gallery-nav:hover { background: rgba(0,0,0,.6); }
    .pdp-gallery-nav.prev { left: 14px; }
    .pdp-gallery-nav.next { right: 14px; }
    .pdp-img-counter { position: absolute; bottom: 14px; right: 14px; background: rgba(0,0,0,.4); color: #fff; font-size: 11px; padding: 3px 10px; border-radius: 999px; }
    .pdp-info-col { padding: 3rem 2.5rem 3rem; overflow-y: auto; }
    .pdp-name { font-family: var(--font-display); font-size: 30px; font-weight: 400; letter-spacing: -.3px; margin-bottom: 8px; line-height: 1.25; }
    .pdp-price-cny { font-size: 28px; font-weight: 600; color: var(--color-accent); }
    .pdp-price-usd { font-size: 13px; color: var(--color-text-secondary); margin-top: 3px; }
    .pdp-divider { height: 1px; background: var(--color-border-tertiary); margin: 1.5rem 0; }
    .pdp-desc { font-size: 14px; color: var(--color-text-secondary); line-height: 1.8; margin-bottom: 1.5rem; }
    .pdp-variant-label { font-size: 11px; font-weight: 600; color: var(--color-text-secondary); margin-bottom: 8px; letter-spacing: .05em; text-transform: uppercase; }
    .pdp-add-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 15px; background: var(--color-accent); color: #fff; border: none; border-radius: var(--border-radius-md); font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 1.5rem; transition: all .15s; letter-spacing: .02em; box-shadow: 0 2px 8px rgba(49,64,33,.25); }
    .pdp-add-btn:hover { background: #243318; box-shadow: 0 4px 16px rgba(49,64,33,.3); }
    .pdp-add-btn:active { transform: scale(.99); }
    @media (max-width: 700px) {
      .pdp-layout { grid-template-columns: 1fr; }
      .pdp-gallery-col { position: relative; top: 0; height: 88vw; min-height: 340px; max-height: 480px; }
      .pdp-main-img { padding: 1rem; }
      .pdp-info-col { padding: 1.5rem 1.25rem 2rem; }
      .pdp-name { font-size: 22px; }
    }
    .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; margin-bottom: 4px; font-weight: 500; background: #e2edd8; color: #314021; }

    /* ── Cart Drawer — Taobao style ── */
    .cart-drawer {
      position: fixed; right: 0; top: 0; bottom: 0;
      width: 480px; max-width: 100vw;
      background: #f5f5f5;
      border-left: none;
      max-height: 100vh; overflow: hidden;
      z-index: 100;
      box-shadow: -4px 0 32px rgba(0,0,0,.18);
      display: flex; flex-direction: column;
    }
    .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 99; }

    /* Header */
    .cart-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      height: 50px;
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0;
    }
    .cart-header-title { font-size: 17px; font-weight: 600; color: #1a1a1a; }
    .cart-header-count { font-size: 13px; color: #999; margin-left: 5px; font-weight: 400; }
    .cart-close-btn {
      width: 32px; height: 32px; border: none; background: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: #999; border-radius: 50%; transition: background .15s;
    }
    .cart-close-btn:hover { background: #f5f5f5; color: #333; }

    /* Filter tabs (加补券 / 官方立减 / 降价) */
    .cart-filter-bar {
      display: flex; gap: 0; background: #fff;
      border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0; overflow-x: auto; scrollbar-width: none;
    }
    .cart-filter-bar::-webkit-scrollbar { display: none; }
    .cart-filter-tab {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px;
      padding: 9px 14px; font-size: 12px; font-weight: 500;
      color: #666; border: none; background: none; cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap; transition: color .15s;
    }
    .cart-filter-tab.on { color: #314021; border-bottom-color: #314021; }
    .cart-filter-tab svg { flex-shrink: 0; }

    /* Body */
    .cart-body { flex: 1; overflow-y: auto; padding: 8px 0 0; }

    /* Store block */
    .cart-store-block {
      background: #fff;
      margin-bottom: 8px;
      border-radius: 0;
    }
    .cart-store-header {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 14px 10px;
      border-bottom: .5px solid #f5f5f5;
    }
    .cart-store-badge {
      font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 3px;
      flex-shrink: 0;
    }
    .cart-store-badge.tmall { background: #314021; color: #fff; }
    .cart-store-badge.taobao { background: #314021; color: #fff; }
    .cart-store-name {
      font-size: 13px; font-weight: 600; color: #1a1a1a;
      display: flex; align-items: center; gap: 4px;
    }
    .cart-store-arrow { color: #bbb; font-size: 12px; }
    .cart-store-coupon {
      margin-left: auto; font-size: 11px; color: #314021; font-weight: 500;
      white-space: nowrap;
    }

    /* Item row */
    .cart-item-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 13px 14px; border-bottom: .5px solid #f8f8f8;
    }
    .cart-item-row:last-child { border-bottom: none; }
    .cart-item-checkbox {
      width: 18px; height: 18px; border-radius: 50%;
      border: 1.5px solid #ddd; background: #fff;
      flex-shrink: 0; margin-top: 28px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s;
    }
    .cart-item-checkbox.checked { border-color: #314021; background: #314021; }

  <!-- Zeabur PostgreSQL REST adapter (replaces Supabase) -->
  <script>
  // Ensure window._fb exists before DOMContentLoaded tries to attach to it
  window._fb = window._fb || { fsdb:null, storeDoc:null, setDoc:null, getDoc:null, onSnapshot:null, doc:null };
  // REST adapter — calls /api/doc/:id on the Node.js backend.
  // No SDK needed. Polling replaces Supabase Realtime.
  window.addEventListener('DOMContentLoaded', function(){
    const MAIN_DOC = 'shopdata';

    // ── Image helpers (base64 stored directly in DB — no separate bucket needed) ──
    window._fb.uploadImage = async function(path, base64DataUrl){
      // With plain PostgreSQL we store base64 inline; just return the dataUrl.
      // This keeps the interface identical to the Supabase version.
      return base64DataUrl;
    };
    window._fb.deleteImage = async function(path){ /* no-op */ };
    window._fb.isBase64 = function(str){ return typeof str==='string' && str.startsWith('data:image'); };

    // ── doc() — returns a ref object (mirrors Firestore/Supabase pattern) ────
    function pgDoc(fsdb_unused, collection_unused, docId){ return { _id: docId }; }

    // ── getDoc(ref) — GET /api/doc/:id ───────────────────────────────────────
    async function pgGetDoc(ref){
      try{
        const res = await fetch('/api/doc/' + encodeURIComponent(ref._id));
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        return { exists: ()=> json.exists, data: ()=> json.data };
      }catch(e){
        console.error('pgGetDoc error (' + ref._id + '):', e);
        throw e;
      }
    }

    // ── setDoc(ref, payload, {merge}) — POST /api/doc/:id ───────────────────
    async function pgSetDoc(ref, payload, opts){
      try{
        const res = await fetch('/api/doc/' + encodeURIComponent(ref._id), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: payload, merge: !!(opts && opts.merge) })
        });
        if(!res.ok) throw new Error('HTTP ' + res.status);
        console.log('PG saved:', ref._id);
      }catch(e){
        console.error('pgSetDoc error (' + ref._id + '):', e);
        throw e;
      }
    }

    // ── onSnapshot(ref, callback) — polling every 30s (replaces Realtime) ───
    // Only the main shopdata doc is polled; image/text docs are large and
    // change rarely — they are fetched once at boot, which is sufficient.
    const _pollTimers = {};
    function pgOnSnapshot(ref, callback){
      const key = ref._id;
      if(_pollTimers[key]) return; // already registered
      // Fire immediately with current value
      pgGetDoc(ref).then(snap=>{ if(snap.exists()) callback(snap); }).catch(()=>{});
      // Then poll every 30 seconds (only for main doc to detect other-device changes)
      if(key === MAIN_DOC){
        _pollTimers[key] = setInterval(async()=>{
          try{
            const snap = await pgGetDoc(ref);
            if(snap.exists()) callback(snap);
          }catch(e){}
        }, 30000);
      }
    }

    function deepMerge(target, source){
      if(!target||typeof target!=='object') return source;
      const out={...target};
      for(const k of Object.keys(source)){
        if(source[k]&&typeof source[k]==='object'&&!Array.isArray(source[k])){
          out[k]=deepMerge(target[k],source[k]);
        } else { out[k]=source[k]; }
      }
      return out;
    }

    // Wire up window._fb and boot
    const storeDocRef = pgDoc(null, null, MAIN_DOC);
    window._fb.fsdb       = null;       // not used by REST adapter
    window._fb.storeDoc   = storeDocRef;
    window._fb.setDoc     = pgSetDoc;
    window._fb.getDoc     = pgGetDoc;
    window._fb.onSnapshot = pgOnSnapshot;
    window._fb.doc        = pgDoc;

    console.log('Zeabur PostgreSQL REST adapter ready — booting...');
    window._boot();
  });
  </script>

// ── Per-session state (never synced to Supabase) ──────────────────────────
// db.cur and cart are persisted to localStorage so they survive page reloads.
// db.adm stays in-memory only for security.
// Everything else (products, referrers, users, adminEmail/Password, heroImage,
// heroTextTitle, heroTextSub, feeRate) is synced globally via Supabase.
const SESSION_KEY = 'netiva_session';
function saveSession(){
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify({cur:db.cur||null,cart:cart||[]}));
  }catch(e){}
}
function restoreSession(){
  try{
    const raw=localStorage.getItem(SESSION_KEY);
    if(!raw)return;
    const s=JSON.parse(raw);
    if(s.cur)db.cur=s.cur;
    if(Array.isArray(s.cart))cart=s.cart;
  }catch(e){}
}

const SYNC_KEYS = ['products','referrers','users','adminEmail','adminPassword',
  'adminCreated','heroTextTitle','heroTextSub','feeRate','carouselSlides'];
// Image-only keys stored in a separate Supabase row to keep the main
// doc small and fast. heroImage + per-product imgs arrays live here.
const IMG_DOC_KEY = 'netiva_images';

let _svPending = false;
let _fbReady = false;
// Supabase adapter references — populated by the inline script above
window._fb = { fsdb:null, storeDoc:null, setDoc:null, getDoc:null, onSnapshot:null, doc:null };
const _fb = window._fb;

// ── Image storage: one Supabase row per product, one for hero, one per referrer ──
// netiva_store row 'hero'      → data: { heroImage: '...' }
// netiva_store row 'img_p1'    → data: { imgs: [...base64...] }
// netiva_store row 'img_p2'    → data: { imgs: [...base64...] }
// netiva_store row 'ref_r1'    → data: { alipayQr: '...', wechatQr: '...' }
// This gives each item its own budget — no more size limits.

function _buildMainPayload(){
  // Strip imgs/img from products and QRs from referrers — keep only metadata
  const payload={};
  SYNC_KEYS.forEach(k=>{
    if(k==='products'){
      payload.products=(db.products||[]).map(p=>{
        const {img,imgs,content_en,content_zh,content_zht,...rest}=p; return rest;
      });
    } else if(k==='referrers'){
      payload.referrers=(db.referrers||[]).map(r=>{
        const {alipayQr,wechatQr,...rest}=r; return rest;
      });
    } else {
      if(db[k]!==undefined) payload[k]=db[k];
    }
  });
  return payload;
}

// Apply a single product image doc { imgs:[...] } into db
function _applyProdImgDoc(prodId, data){
  if(!data) return;
  const prod=(db.products||[]).find(p=>p.id===prodId);
  if(!prod) return;
  if(Array.isArray(data.imgs)){ prod.imgs=data.imgs; prod.img=data.imgs[0]||''; }
}
// Apply a single product text doc { content_en, content_zh } into db
function _applyProdTextDoc(prodId, data){
  if(!data) return;
  const prod=(db.products||[]).find(p=>p.id===prodId);
  if(!prod) return;
  if(data.content_en!==undefined) prod.content_en=data.content_en;
  if(data.content_zh!==undefined) prod.content_zh=data.content_zh;
  if(data.content_zht!==undefined) prod.content_zht=data.content_zht;
}
// Apply hero doc
function _applyHeroDoc(data){
  if(!data) return;
  if(data.heroImage!==undefined) db.heroImage=data.heroImage;
}
// Apply referrer QR doc
function _applyRefDoc(refId, data){
  if(!data) return;
  const ref=(db.referrers||[]).find(r=>r.id===refId);
  if(!ref) return;
  if(data.alipayQr!==undefined) ref.alipayQr=data.alipayQr;
  if(data.wechatQr!==undefined) ref.wechatQr=data.wechatQr;
}

// Legacy: still support reading old shopimages doc during migration
function _applyImgPayload(data){
  if(!data) return;
  if(data.heroImage!==undefined) db.heroImage=data.heroImage;
  (db.products||[]).forEach(prod=>{
    const key='pi_'+prod.id;
    if(data[key]!==undefined){ prod.imgs=data[key]; prod.img=data[key][0]||''; }
  });
  (db.referrers||[]).forEach(ref=>{
    if(data['aqr_'+ref.id]!==undefined) ref.alipayQr=data['aqr_'+ref.id];
    if(data['wqr_'+ref.id]!==undefined) ref.wechatQr=data['wqr_'+ref.id];
  });
}

// Build localStorage cache of all images (flat, for fast boot)
function _buildLocalImgCache(){
  const p={};
  if(db.heroImage!==undefined) p.heroImage=db.heroImage;
  (db.products||[]).forEach(prod=>{
    if(prod.imgs&&prod.imgs.length) p['pi_'+prod.id]=prod.imgs;
    else if(prod.img) p['pi_'+prod.id]=[prod.img];
  });
  (db.referrers||[]).forEach(ref=>{
    if(ref.alipayQr) p['aqr_'+ref.id]=ref.alipayQr;
    if(ref.wechatQr) p['wqr_'+ref.id]=ref.wechatQr;
  });
  return p;
}

// ── Dirty-doc tracking ───────────────────────────────────────────────────────
// Instead of re-uploading every row on every sv() call, we track exactly which
// Supabase rows have pending changes and flush only those.
const _dirtyDocs={}; // docId -> payload to write
let _flushTimer=null;

// Mark a specific doc as needing a write. payload=null means "main store doc".
function _markDirty(docId, payload){
  _dirtyDocs[docId]=payload;
}

// Flush all dirty docs to Firestore immediately (no delay).
async function _flushDirty(){
  if(_flushTimer){ clearTimeout(_flushTimer); _flushTimer=null; }
  if(typeof _fb?.setDoc !== 'function') return;
  const ids=Object.keys(_dirtyDocs);
  if(!ids.length) return;
  // Snapshot and clear immediately so concurrent calls don't double-write
  const toWrite={..._dirtyDocs};
  ids.forEach(id=>{ delete _dirtyDocs[id]; });
  await Promise.all(ids.map(async id=>{
    try{
      if(id==='__main__'){
        await _fb.setDoc(_fb.storeDoc, _buildMainPayload(), {merge:true});
      } else {
        const ref=_fb.doc(_fb.fsdb,'netiva',id);
        await _fb.setDoc(ref, toWrite[id], {merge:true});
      }
    }catch(e){ console.warn('Supabase write failed ('+id+'):',e); }
  }));
}

// Debounced flush — used for rapid-fire changes (e.g. typing in a field).
function _scheduleDirtyFlush(delayMs=150){
  if(_flushTimer) clearTimeout(_flushTimer);
  _flushTimer=setTimeout(()=>{ _flushTimer=null; _flushDirty(); }, delayMs);
}

// sv(immediate) — call with immediate=true from explicit "Save" button handlers
// so changes appear for other users without any delay.
function sv(immediate=false){
  db.feeRate = FEE_RATE;
  // Always update localStorage instantly
  try{
    const mainSnap={...db, products:_buildMainPayload().products, referrers:_buildMainPayload().referrers};
    localStorage.setItem('netiva_shop', JSON.stringify(mainSnap));
    localStorage.setItem(IMG_DOC_KEY, JSON.stringify(_buildLocalImgCache()));
  }catch(e){}
  if(!_fbReady) return;

  // Main metadata row — always dirty when sv() is called
  _markDirty('__main__', null);

  // Hero image
  if(db.heroImage) _markDirty('hero', {heroImage: db.heroImage});

  // Only dirty the image/text docs for products that have content
  // (we don't re-dirty every product — callers use svProd() for targeted writes)
  (db.products||[]).forEach(prod=>{
    const imgs=prod.imgs&&prod.imgs.length ? prod.imgs : (prod.img ? [prod.img] : []);
    if(imgs.length) _markDirty('img_'+prod.id, {imgs});
    const hasText=prod.content_en||prod.content_zh||prod.content_zht;
    if(hasText) _markDirty('text_'+prod.id, {content_en:prod.content_en||'', content_zh:prod.content_zh||'', content_zht:prod.content_zht||''});
  });

  (db.referrers||[]).forEach(ref=>{
    if(ref.alipayQr||ref.wechatQr) _markDirty('ref_'+ref.id, {alipayQr:ref.alipayQr||'', wechatQr:ref.wechatQr||''});
  });

  if(immediate){ _flushDirty(); }
  else { _scheduleDirtyFlush(150); }
}

// Targeted save for a single product — only uploads docs that belong to it.
// Pass immediate=true from explicit Save button handlers.
function svProd(prodId, immediate=false){
  db.feeRate = FEE_RATE;

    const mainSnap={...db, products:_buildMainPayload().products, referrers:_buildMainPayload().referrers};
    localStorage.setItem('netiva_shop', JSON.stringify(mainSnap));
    localStorage.setItem(IMG_DOC_KEY, JSON.stringify(_buildLocalImgCache()));
  }catch(e){}
  if(!_fbReady) return;

  _markDirty('__main__', null);
  const prod=(db.products||[]).find(p=>p.id===prodId);
  if(prod){
    const imgs=prod.imgs&&prod.imgs.length ? prod.imgs : (prod.img ? [prod.img] : []);
    if(imgs.length) _markDirty('img_'+prodId, {imgs});
    const hasText=prod.content_en||prod.content_zh||prod.content_zht;
    if(hasText) _markDirty('text_'+prodId, {content_en:prod.content_en||'', content_zh:prod.content_zh||'', content_zht:prod.content_zht||''});
  }
  if(immediate){ _flushDirty(); }
  else { _scheduleDirtyFlush(150); }
}

// Track which doc IDs already have live listeners so we never double-register
const _liveListeners=new Set();

// During the initial Pass-2 image fetch we don't want every onSnapshot callback
// (which fires immediately upon registration with the current value) to trigger
// a re-render, because Pass-2 calls render() itself once everything is loaded.
// Set to true while Pass-2 is running; snapshot callbacks check this before rendering.
let _bootImgFetchInProgress=false;

// Debounced render: coalesces rapid snapshot events into a single repaint
let _renderDebounceTimer=null;
function _debouncedRender(){
  if(_bootImgFetchInProgress) return; // Pass-2 will render when done
  if(_renderDebounceTimer) clearTimeout(_renderDebounceTimer);
  _renderDebounceTimer=setTimeout(()=>{_renderDebounceTimer=null;try{render();}catch(e){}},120);
}

// Register onSnapshot listeners for a product doc that didn't exist at boot time
function _attachProdListeners(prod){
  if(!_fb.onSnapshot||!_fb.fsdb) return;
  const imgDocId='img_'+prod.id;
  const txtDocId='text_'+prod.id;
  if(!_liveListeners.has(imgDocId)){
    _liveListeners.add(imgDocId);
    try{
      const ref=_fb.doc(_fb.fsdb,'netiva',imgDocId);
      _fb.onSnapshot(ref,(snap)=>{
        if(!snap.exists()) return;
        _applyProdImgDoc(prod.id,snap.data());
        try{localStorage.setItem(IMG_DOC_KEY,JSON.stringify(_buildLocalImgCache()));}catch(e){}
        if(!db.adm){_debouncedRender();}
      });
    }catch(e){console.warn('Supabase listener attach failed for '+imgDocId,e);}
  }
  if(!_liveListeners.has(txtDocId)){
    _liveListeners.add(txtDocId);
    try{
      const ref=_fb.doc(_fb.fsdb,'netiva',txtDocId);
      _fb.onSnapshot(ref,(snap)=>{
        if(!snap.exists()) return;
        _applyProdTextDoc(prod.id,snap.data());
        _debouncedRender();
      });
    }catch(e){console.warn('Supabase listener attach failed for '+txtDocId,e);}
  }
}

// Register onSnapshot listener for a referrer QR doc
function _attachRefListener(ref){
  if(!_fb.onSnapshot||!_fb.fsdb) return;
  const docId='ref_'+ref.id;
  if(_liveListeners.has(docId)) return;
  _liveListeners.add(docId);
  try{
    const docRef=_fb.doc(_fb.fsdb,'netiva',docId);
    _fb.onSnapshot(docRef,(snap)=>{
      if(!snap.exists()) return;
      _applyRefDoc(ref.id,snap.data());
      try{localStorage.setItem(IMG_DOC_KEY,JSON.stringify(_buildLocalImgCache()));}catch(e){}
      if(!db.adm){_debouncedRender();}
    });
  }catch(e){console.warn('Supabase listener attach failed for '+docId,e);}
}



// Merge remote main-doc snapshot into local db.
// Images live in a separate doc and are applied via _applyImgPayload().
function _applyRemote(data){
  if(!data) return;
  SYNC_KEYS.forEach(k=>{
    if(data[k]===undefined) return;
    if(k==='products'){
      // Merge metadata only — preserve existing imgs arrays already in memory
      const incoming=data[k];
      const existing=db.products||[];
      db.products=incoming.map(np=>{
        const old=existing.find(op=>op.id===np.id)||{};
        return {...np, img:old.img||np.img||'', imgs:old.imgs||np.imgs||[],
          content_en:old.content_en||np.content_en||'',
          content_zh:old.content_zh||np.content_zh||'',
          content_zht:old.content_zht||np.content_zht||''};
      });
    } else if(k==='referrers'){
      const incoming=data[k];
      const existing=db.referrers||[];
      db.referrers=incoming.map(nr=>{
        const old=existing.find(or=>or.id===nr.id)||{};
        return {...nr, alipayQr:old.alipayQr||nr.alipayQr||'', wechatQr:old.wechatQr||nr.wechatQr||''};
      });
    } else {
      db[k]=data[k];
    }
  });
  if(!db.products?.length) db.products=[...DEFAULT_PRODS];
  if(typeof db.feeRate==='number') FEE_RATE=db.feeRate;
  // Also cache main snapshot to localStorage
  try{localStorage.setItem('netiva_shop', JSON.stringify(db));}catch(e){}
}

// Bootstrap: instant paint from cache, then hydrate from Supabase in two passes
window._boot = async function _boot(){
  // ── Pass 0: render instantly from localStorage (zero network wait) ────────
  let hadCache=false;
  try{
    const cached=localStorage.getItem('netiva_shop');
    if(cached){ const p=JSON.parse(cached); _applyRemote(p); hadCache=true; }
    // Also restore cached images (flat legacy format works for both old and new)
    const cachedImgs=localStorage.getItem(IMG_DOC_KEY);
    if(cachedImgs){ _applyImgPayload(JSON.parse(cachedImgs)); }
  }catch(e){}

  if(hadCache){
    restoreSession();
    rNav();
    go('shop');
  } else {
    _showLoader();
  }

  // ── Pass 1: fetch lightweight metadata row (no images) ───────────────────
  try{
    const snap = await _fb.getDoc(_fb.storeDoc);
    if(snap.exists()){
      _applyRemote(snap.data());
    } else {
      // First ever run — seed Firestore with defaults
      const mainSeed=_buildMainPayload();
      mainSeed.products=DEFAULT_PRODS.map(p=>{const{img,imgs,...r}=p;return r;});
      await _fb.setDoc(_fb.storeDoc, mainSeed);
    }
  }catch(e){
    console.warn('Supabase main read failed:',e);
    if(!hadCache){
      const warn=document.createElement('div');
      warn.style.cssText='position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#FFF3CD;border:1px solid #EAD0A8;color:#854F0B;font-size:12px;padding:8px 16px;border-radius:8px;z-index:9999;max-width:420px;text-align:center';
      warn.innerHTML='⚠️ Could not reach the shared database. Changes may not sync until reconnected. <button onclick="this.parentNode.remove()" style="border:none;background:none;cursor:pointer;font-size:14px;margin-left:8px;color:#854F0B">×</button>';
      document.body.appendChild(warn);
    }
  }

  _fbReady=true;
  restoreSession();
  rNav();
  try{ go('shop'); }catch(e){}

  // ── Pass 2: fetch all image rows in background (non-blocking) ────────────
  // Set flag so snapshot callbacks that fire during listener registration
  // (Firestore fires onSnapshot immediately with the current value) don't
  // trigger extra re-renders while we're still loading everything.
  _bootImgFetchInProgress=true;
  (async()=>{
    try{
      // Fetch hero image doc
      const heroRef=_fb.doc(_fb.fsdb,'netiva','hero');
      const heroSnap=await _fb.getDoc(heroRef);
      if(heroSnap.exists()) _applyHeroDoc(heroSnap.data());

      // Fetch per-product image docs
      await Promise.all((db.products||[]).map(async prod=>{
        try{
          const ref=_fb.doc(_fb.fsdb,'netiva','img_'+prod.id);
          const snap=await _fb.getDoc(ref);
          if(snap.exists()) _applyProdImgDoc(prod.id, snap.data());
        }catch(e){ console.warn('Supabase img read failed for '+prod.id,e); }
      }));

      // Fetch per-product extended text docs
      await Promise.all((db.products||[]).map(async prod=>{
        try{
          const ref=_fb.doc(_fb.fsdb,'netiva','text_'+prod.id);
          const snap=await _fb.getDoc(ref);
          if(snap.exists()) _applyProdTextDoc(prod.id, snap.data());
        }catch(e){ console.warn('Supabase text read failed for '+prod.id,e); }
      }));

      // Fetch per-referrer QR docs
      await Promise.all((db.referrers||[]).map(async ref=>{
        try{
          const docRef=_fb.doc(_fb.fsdb,'netiva','ref_'+ref.id);
          const snap=await _fb.getDoc(docRef);
          if(snap.exists()) _applyRefDoc(ref.id, snap.data());
        }catch(e){ console.warn('Supabase ref img read failed for '+ref.id,e); }
      }));

      // Also try old shopimages row for migration (in case data is still there)
      try{
        const oldRef=_fb.doc(_fb.fsdb,'netiva','shopimages');
        const oldSnap=await _fb.getDoc(oldRef);
        if(oldSnap.exists()) _applyImgPayload(oldSnap.data());
      }catch(e){}

      // Cache all images locally
      try{localStorage.setItem(IMG_DOC_KEY, JSON.stringify(_buildLocalImgCache()));}catch(e){}
      // Clear the boot flag before the final render so snapshot callbacks can
      // trigger renders normally from this point on.
      _bootImgFetchInProgress=false;
      // Always re-render after images/text have loaded so they appear for everyone
      try{render();}catch(e){}
      // Migrate any legacy base64 images to Storage in the background
      setTimeout(()=>{ _migrateBase64ToStorage().catch(e=>console.warn('[migrate] error:',e)); }, 2000);
    }catch(e){ _bootImgFetchInProgress=false; console.warn('Supabase image read failed:',e); }
  })();

  // ── Live listeners ────────────────────────────────────────────────────────
  try{
    _fb.onSnapshot(_fb.storeDoc, (snap)=>{
      if(!snap.exists()) return;
      _applyRemote(snap.data());
      if(!db.adm){ _debouncedRender(); }
    });
  }catch(e){ console.warn('Supabase main listener failed:',e); }

  // Live listener for hero image
  try{
    const heroRef=_fb.doc(_fb.fsdb,'netiva','hero');
    _fb.onSnapshot(heroRef,(snap)=>{
      if(!snap.exists()) return;
      _applyHeroDoc(snap.data());
      try{localStorage.setItem(IMG_DOC_KEY,JSON.stringify(_buildLocalImgCache()));}catch(e){}
      if(!db.adm){ _debouncedRender(); }
    });
  }catch(e){ console.warn('Supabase hero listener failed:',e); }

  // Live listeners for each product image/text doc (uses dedup helper)
  (db.products||[]).forEach(prod=>{ _attachProdListeners(prod); });

  // Live listeners for each referrer QR doc (uses dedup helper)
  (db.referrers||[]).forEach(ref=>{ _attachRefListener(ref); });
}


// ── One-time migration: move any legacy base64 images from DB rows to Supabase Storage ──
// Runs silently in background after boot. Only migrates if uploadImage is available
// and the stored value starts with 'data:image'. Safe to run repeatedly (idempotent).
async function _migrateBase64ToStorage(){
  if(!_fb.uploadImage || !_fb.isBase64) return;
  let migrated=false;

  // Hero image
  if(_fb.isBase64(db.heroImage)){
    console.log('[migrate] uploading hero image to Storage...');
    const url=await _fb.uploadImage('hero/banner', db.heroImage);
    if(url){ db.heroImage=url; _markDirty('hero',{heroImage:url}); migrated=true; }
  }

  // Product images
  for(const prod of (db.products||[])){
    const imgs=prod.imgs&&prod.imgs.length?prod.imgs:(prod.img?[prod.img]:[]);
    const needsMigration=imgs.some(s=>_fb.isBase64(s));
    if(!needsMigration) continue;
    console.log('[migrate] uploading images for product',prod.id);
    const newImgs=await Promise.all(imgs.map(async(src,i)=>{
      if(!_fb.isBase64(src)) return src;
      const url=await _fb.uploadImage('products/'+prod.id+'_'+i, src);
      return url||src;
    }));
    prod.imgs=newImgs; prod.img=newImgs[0]||'';
    _markDirty('img_'+prod.id,{imgs:newImgs});
    migrated=true;
  }

  // Referrer QR codes
  for(const ref of (db.referrers||[])){
    let refMigrated=false;
    if(_fb.isBase64(ref.alipayQr)){
      const url=await _fb.uploadImage('referrers/'+ref.id+'_alipay', ref.alipayQr);
      if(url){ ref.alipayQr=url; refMigrated=true; }
    }
    if(_fb.isBase64(ref.wechatQr)){
      const url=await _fb.uploadImage('referrers/'+ref.id+'_wechat', ref.wechatQr);
      if(url){ ref.wechatQr=url; refMigrated=true; }
    }
    if(refMigrated){ _markDirty('ref_'+ref.id,{alipayQr:ref.alipayQr||'',wechatQr:ref.wechatQr||''}); migrated=true; }
  }

  if(migrated){
    console.log('[migrate] flushing migrated URLs to DB...');
    await _flushDirty();
    try{localStorage.setItem(IMG_DOC_KEY,JSON.stringify(_buildLocalImgCache()));}catch(e){}
    console.log('[migrate] done — base64 images replaced with Storage URLs. DB egress will drop significantly.');
  }
}

// Wait for Supabase adapter to be ready, then boot
// Safety fallback: if Supabase never loads (e.g. blocked/offline), boot from cache after 3s
setTimeout(()=>{
  if(!_fbReady){
    _fbReady=true;
    try{
      const cached=localStorage.getItem('netiva_shop');if(cached){const p=JSON.parse(cached);_applyRemote(p);}
      const cachedImgs=localStorage.getItem(IMG_DOC_KEY);if(cachedImgs){_applyImgPayload(JSON.parse(cachedImgs));}
    }catch(e){}
    go('shop');
  }
}, 3000);

    nav.style.top='0';

  const pdpEl=document.getElementById('pdp');const rootEl=document.getElementById('root');

// ── Hero Carousel ──────────────────────────────────────────────────────────
let _heroIdx=0, _heroTotal=4, _heroTimer=null, _heroPaused=false;
let _heroTouchStartX=0, _heroTouchMoved=false;

function heroCarouselInit(){
  const track=document.getElementById('hero-track');
  const carousel=document.getElementById('hero-carousel');
  if(!track||!carousel) return;
  _heroIdx=0;
  _heroTotal=carousel.querySelectorAll('.hero-slide').length;
  heroUpdateTrack();
  heroResume();
  // Touch / swipe support
  carousel.addEventListener('touchstart',e=>{_heroTouchStartX=e.touches[0].clientX;_heroTouchMoved=false;},{passive:true});
  carousel.addEventListener('touchmove',e=>{if(Math.abs(e.touches[0].clientX-_heroTouchStartX)>8)_heroTouchMoved=true;},{passive:true});
  carousel.addEventListener('touchend',e=>{
    if(!_heroTouchMoved)return;

/* ── Rich Text Editor helpers ── */
function rteHtml(id, value, placeholder){
  const isEmpty = !value || value === '<p><br></p>' || value.trim() === '';
  const body = isEmpty ? '' : value;
  return `<div class="rte-wrap" id="rte-wrap-${id}">
    <div class="rte-toolbar">
      <button type="button" class="rte-btn" title="Bold" onmousedown="event.preventDefault();rteCmd('${id}','bold')"><b>B</b></button>
      <button type="button" class="rte-btn" title="Italic" onmousedown="event.preventDefault();rteCmd('${id}','italic')"><i>I</i></button>
      <button type="button" class="rte-btn" title="Underline" onmousedown="event.preventDefault();rteCmd('${id}','underline')"><u>U</u></button>
      <div class="rte-sep"></div>
      <button type="button" class="rte-btn" title="Heading" onmousedown="event.preventDefault();rteCmd('${id}','heading')">H</button>
      <div class="rte-sep"></div>
      <button type="button" class="rte-btn" title="Bullet list" onmousedown="event.preventDefault();rteCmd('${id}','insertUnorderedList')">• ≡</button>
      <button type="button" class="rte-btn" title="Numbered list" onmousedown="event.preventDefault();rteCmd('${id}','insertOrderedList')">1. ≡</button>
      <div class="rte-sep"></div>
      <button type="button" class="rte-btn" title="Clear formatting" onmousedown="event.preventDefault();rteCmd('${id}','removeFormat')" style="font-size:11px">✕ fmt</button>
    </div>
    <div class="rte-body" id="${id}" contenteditable="true" data-placeholder="${placeholder}">${body}</div>
  </div>`;
}
function rteCmd(id, cmd){
  const el = document.getElementById(id);
  if(!el) return;
  el.focus();
  if(cmd === 'heading'){
    // Toggle h3 / p
    const sel = window.getSelection();
    if(sel && sel.rangeCount){
      let node = sel.anchorNode;
      while(node && node !== el){
        if(node.nodeName === 'H3'){ document.execCommand('formatBlock',false,'p'); return; }
        node = node.parentNode;
      }
    }
    document.execCommand('formatBlock', false, 'h3');
  } else {
    document.execCommand(cmd, false, null);
  }
}
function getRteHtml(id){
  const el = document.getElementById(id);
  if(!el) return '';
  const html = el.innerHTML.trim();
  if(html === '<br>' || html === '') return '';
  return html;
}

/* ── Image crop / pan / zoom tool ── */
const cropState={};
function openCropTool(pfx,imgIdx){
  const imgs=window[pfx+'imgs'];if(!imgs||!imgs[imgIdx])return;
  const area=document.getElementById(pfx+'crop-tool-area');if(!area)return;
  const key=pfx+imgIdx;
  if(!cropState[key])cropState[key]={scale:1,ox:0,oy:0,dragging:false,sx:0,sy:0};
  area.innerHTML=`
    <div style="background:var(--color-background-primary);border:.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:12px;margin-top:4px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:12px;font-weight:500">${lang==='en'?'Edit Image — drag to pan, slider to zoom':'编辑图片 — 拖动平移，滑块缩放'}</div>
        <button class="btn sm" onclick="applyImgCrop('${pfx}',${imgIdx})" style="background:var(--color-text-primary);color:#fff;border-color:transparent">${lang==='en'?'Apply Crop':'应用裁切'}</button>
      </div>
      <div class="crop-container" id="${key}-cc" style="height:260px">
        <canvas id="${key}-cv" class="crop-canvas" style="height:260px;width:100%"></canvas>
      </div>
      <div class="crop-controls">
        <label>${lang==='en'?'Zoom':'缩放'}</label>
        <input type="range" id="${key}-zoom" min="0.5" max="4" step="0.01" value="${cropState[key].scale}" oninput="cropZoom('${pfx}',${imgIdx},this.value)">
        <button class="btn sm" onclick="cropReset('${pfx}',${imgIdx})">${lang==='en'?'Reset':'重置'}</button>
        <button class="btn sm d" onclick="document.getElementById('${pfx}crop-tool-area').innerHTML=''">${lang==='en'?'Close':'关闭'}</button>
      </div>
    </div>`;
  const cc=document.getElementById(key+'-cc');
  const cv=document.getElementById(key+'-cv');
  const img=new Image();
  img.onload=()=>{
    cropState[key].img=img;
    cv.width=cc.offsetWidth;cv.height=260;
    if(!cropState[key].initialized){cropState[key].ox=0;cropState[key].oy=0;cropState[key].scale=1;cropState[key].initialized=true;}
    drawCrop(key);
    // Drag to pan

function drawCrop(key){
  const s=cropState[key];if(!s||!s.img)return;
  const cv=document.getElementById(key+'-cv');if(!cv)return;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const iw=s.img.naturalWidth,ih=s.img.naturalHeight;
  const baseScale=Math.max(cv.width/iw,cv.height/ih);
  const sc=baseScale*s.scale;
  const dw=iw*sc,dh=ih*sc;
  const cx=cv.width/2+s.ox,cy=cv.height/2+s.oy;
  ctx.drawImage(s.img,cx-dw/2,cy-dh/2,dw,dh);
}

  if(panel)panel.style.display=panel.style.display==='block'?'none':'block';
}
function saveAdmSlideEdit(idx){

  s.badge_en=document.getElementById('adm-se-badge-en-'+idx)?.value.trim()||'';

  s.title_zh=document.getElementById('adm-se-title-zh-'+idx)?.value.trim()||s.title_zh;
  s.title_zht=document.getElementById('adm-se-title-zht-'+idx)?.value.trim()||s.title_zht;
  s.sub_en=document.getElementById('adm-se-sub-en-'+idx)?.value.trim()||'';
  s.sub_zh=document.getElementById('adm-se-sub-zh-'+idx)?.value.trim()||'';
  s.sub_zht=document.getElementById('adm-se-sub-zht-'+idx)?.value.trim()||'';
  s.btn_en=document.getElementById('adm-se-btn-en-'+idx)?.value.trim()||'Shop Now';
  s.btn_zh=document.getElementById('adm-se-btn-zh-'+idx)?.value.trim()||'立即选购';
  s.btn_zht=document.getElementById('adm-se-btn-zht-'+idx)?.value.trim()||'立即選購';

function handleSlideImgAdm(e,idx){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=async ev=>{
    let src=ev.target.result;
    if(_fb.uploadImage){const url=await _fb.uploadImage('hero/slide'+idx,src);if(url)src=url;}
    const slides=getCarouselSlides().map(s=>({...s}));
    slides[idx].bg=src;
    db.carouselSlides=slides;
    sv(true);
    rAdmSettings(document.getElementById('atc'));
  };
  rd.readAsDataURL(f);
}
function removeSlideImgAdm(idx){
  const slides=getCarouselSlides().map(s=>({...s}));
  slides[idx].bg='';
  db.carouselSlides=slides;
  sv(true);
  rAdmSettings(document.getElementById('atc'));
}function handleHeroImg(e){
  const f=e.target.files[0];if(!f)return;
  const msg=document.getElementById('hero-img-msg');
  if(msg)msg.innerHTML=`<div class="m" style="color:var(--color-text-secondary)">${lang==='en'?'Uploading…':lang==='zht'?'上傳中…':'上传中…'}</div>`;
  const rd=new FileReader();
  rd.onload=async ev=>{
    // Upload to Supabase Storage (not the database) — only a URL is stored in DB
    if(_fb.uploadImage){
      const url=await _fb.uploadImage('hero/banner', ev.target.result);
      db.heroImage = url || ev.target.result; // fallback to base64 if upload fails
    } else {
      db.heroImage=ev.target.result;
    }
    sv(true);
    if(msg)msg.innerHTML=`<div class="m s">${lang==='en'?'Banner image saved!':lang==='zht'?'橫幅圖片已儲存！':'横幅图片已保存！'}</div>`;
    rAdmSettings(document.getElementById('atc'));
  };
  rd.readAsDataURL(f);
}
function removeHeroImg(){db.heroImage='';sv(true);rAdmSettings(document.getElementById('atc'));}
function saveHeroTextSettings(){const title=document.getElementById('stg-hero-title')?.value.trim(),sub=document.getElementById('stg-hero-sub')?.value.trim(),msg=document.getElementById('hero-text-msg');if(title!==undefined)db.heroTextTitle=title;if(sub!==undefined)db.heroTextSub=sub;sv(true);if(msg)msg.innerHTML='<div class="m s" style="font-size:12px">'+(lang==='en'?'Text saved!':lang==='zht'?'文字已儲存！':'文字已保存！')+'</div>';setTimeout(()=>{if(msg)msg.innerHTML='';},2000);}function ckAS2(pw){const b=document.getElementById('stg-sb');if(!b)return;if(!pw){b.style.width='0%';return;}let s=0;if(pw.length>=8)s++;if(/[A-Z]/.test(pw))s++;if(/[0-9]/.test(pw))s++;if(/[^A-Za-z0-9]/.test(pw))s++;b.style.width=['0%','25%','50%','75%','100%'][s];b.style.background=['#E24B4A','#E24B4A','#EF9F27','#7a9c5a','#314021'][s];}
function saveAdminSettings(){const em=document.getElementById('stg-email').value.trim().toLowerCase(),cur=document.getElementById('stg-cur-pw').value,npw=document.getElementById('stg-new-pw').value,npw2=document.getElementById('stg-new-pw2').value,msg=document.getElementById('stg-msg');if(cur!==db.adminPassword){msg.innerHTML=`<div class="m e">${t('errorCurrentPassword')}</div>`;return;}if(!em){msg.innerHTML=`<div class="m e">${t('errorEmailRequired')}</div>`;return;}if(npw&&npw.length<8){msg.innerHTML=`<div class="m e">${t('errorPassShort')}</div>`;return;}if(npw&&npw!==npw2){msg.innerHTML=`<div class="m e">${t('errorPassMismatch')}</div>`;return;}db.adminEmail=em;if(npw)db.adminPassword=npw;sv(true);msg.innerHTML=`<div class="m s">${t('credentialsSaved')}</div>`;document.getElementById('stg-cur-pw').value='';document.getElementById('stg-new-pw').value='';document.getElementById('stg-new-pw2').value='';if(document.getElementById('stg-sb'))document.getElementById('stg-sb').style.width='0%';}

function toggleFeeEdit(){const ed=document.getElementById('fee-edit'),disp=document.getElementById('fee-display');if(!ed||!disp)return;const isOpen=ed.style.display==='block';ed.style.display=isOpen?'none':'block';if(!isOpen){document.getElementById('fee-input').value=(FEE_RATE*100).toFixed(4).replace(/\.?0+$/,'');document.getElementById('fee-input').focus();}}
function saveFeeRate(){const inp=document.getElementById('fee-input'),msg=document.getElementById('fee-msg');const v=parseFloat(inp.value);if(isNaN(v)||v<0||v>100){msg.innerHTML=`<div class="m e" style="font-size:11px;padding:4px 8px">${lang==='en'?'Enter 0–100':(lang==='zht'?'請輸入 0–100':'请输入 0–100')}</div>`;return;}FEE_RATE=parseFloat((v/100).toFixed(6));sv(true);document.getElementById('fee-display').textContent=(v).toFixed(2).replace(/\.?0+$/,'')+'%';document.getElementById('fee-edit').style.display='none';msg.innerHTML='';}
